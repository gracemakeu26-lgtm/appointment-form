<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Limelight&family=Lobster&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playwrite+NZ+Guides&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Studio Lumière — Demande de rendez-vous</title>
  </head>
  <body>
    <header>
      <h1>Studio Lumière - Demande de rendez-vous</h1>
      <p>
        Veuillez remplir le formulaire ci-dessous pour demander un rendez-vous
        avec notre studio.
      </p>
    </header>
    <main>
      <form id="mainForm" novalidate>
        <div class="field">
          <label for="name">Nom : </label>
          <input
            type="text"
            id="name"
            name="name"
            required
            aria-describedby="nameError"
          />
          <p id="nameError"></p>
        </div>
        <div class="field">
          <label for="email">Email : </label>
          <input
            type="email"
            id="email"
            name="email"
            required
            aria-describedby="emailError"
          />
          <p id="emailError"></p>
        </div>
        <div class="full field">
          <label for="service">Prestation</label>
          <select
            name="service"
            id="service"
            required
            aria-describedby="serviceError"
          >
            <option value="hairdressing">Coiffure</option>
            <option value="massage">Massage</option>
            <option value="treatment">Soins Corporels</option>
            <option value="manicure" selected>Manucure</option>
          </select>
          <p id="serviceError"></p>
        </div>
        <div class="full field">
          <label for="date">Date</label>
          <input
            type="date"
            name="date"
            id="date"
            required
            aria-describedby="dateError"
          />
          <p id="dateError"></p>
        </div>

        <div class="full field">
          <label for="message">Message (300 caractères max) *</label>
          <textarea
            name="message"
            id="message"
            required
            aria-describedby="messageError"
          ></textarea>
          <p id="messageError"></p>
          <small id="charCount">0 / 300</small>
        </div>

        <input type="submit" value="Submit" class="button" />
        <div id="recap">
          <div id="recapContent"></div>
        </div>
      </form>
      <p id="successMessage"></p>
      <div class="list-container">
        <h2>Demandes en attente (<span id="count">0</span>)</h2>
        <div id="table-wrapper">
        
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
